spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/skirt_cabinet?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


server.port=8080
server.address=0.0.0.0
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

image.base-url=http://localhost:8080/images/

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml


spring.mvc.static-path-pattern=/images/**

wechat.appid=${WECHAT_APPID}
wechat.secret=${WECHAT_SECRET}
wechat.template-id=${WECHAT_TEMPLATE_ID}

# ??????
image.storage.path=./yydyc-images/
spring.web.resources.static-locations=classpath:/static/,file:D:/yydyc-images/

#API
ai.model.api-key=${SILICONFLOW_API_KEY}
ai.model.model-name=Qwen/Qwen3-8B
ai.model.base-url=https://api.siliconflow.cn/v1/chat/completions

# ==================== Redis ?? ====================
# ????????????????? Docker ??
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=3000ms

# Lettuce ?????
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.shutdown-timeout=100ms

